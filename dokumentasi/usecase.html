<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Use Case — Aplikasi Peminjaman Alat</title>
<style>
body { font-family:'Segoe UI',sans-serif; background:#f8fafc; margin:0; padding:24px; }
h2 { text-align:center; color:#4f46e5; margin-bottom:4px; }
p  { text-align:center; color:#6b7280; font-size:13px; margin-bottom:24px; }
.wrap { background:#fff; border-radius:12px; padding:32px; box-shadow:0 4px 20px rgba(0,0,0,.08); max-width:1000px; margin:0 auto; }
svg { width:100%; height:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Use Case Diagram</h2>
  <p>Aplikasi Peminjaman Alat — UKK RPL 2025/2026</p>
  <svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,sans-serif" font-size="13">
    <defs>
      <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/>
      </marker>
    </defs>

    <!-- System boundary -->
    <rect x="200" y="40" width="580" height="620" rx="12" fill="#f8fafc" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="490" y="30" text-anchor="middle" font-weight="700" font-size="15" fill="#4f46e5">Sistem Aplikasi Peminjaman Alat</text>

    <!-- Use cases -->
    <!-- Auth -->
    <ellipse cx="490" cy="90" rx="80" ry="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="490" y="95" text-anchor="middle" fill="#3730a3" font-weight="600">Login / Logout</text>

    <!-- Admin UCs -->
    <ellipse cx="360" cy="170" rx="80" ry="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="360" y="175" text-anchor="middle" fill="#991b1b" font-weight="600">Kelola User</text>

    <ellipse cx="360" cy="230" rx="80" ry="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="360" y="235" text-anchor="middle" fill="#991b1b" font-weight="600">Kelola Kategori</text>

    <ellipse cx="360" cy="290" rx="80" ry="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="360" y="295" text-anchor="middle" fill="#991b1b" font-weight="600">Lihat Log Aktivitas</text>

    <!-- Petugas UCs -->
    <ellipse cx="620" cy="170" rx="90" ry="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="620" y="175" text-anchor="middle" fill="#92400e" font-weight="600">Kelola Data Alat</text>

    <ellipse cx="620" cy="230" rx="90" ry="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="620" y="235" text-anchor="middle" fill="#92400e" font-weight="600">Setujui/Tolak Pinjaman</text>

    <ellipse cx="620" cy="290" rx="90" ry="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="620" y="295" text-anchor="middle" fill="#92400e" font-weight="600">Proses Pengembalian</text>

    <ellipse cx="620" cy="350" rx="90" ry="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="620" y="355" text-anchor="middle" fill="#92400e" font-weight="600">Cetak Laporan PDF</text>

    <!-- Peminjam UCs -->
    <ellipse cx="490" cy="430" rx="90" ry="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="490" y="435" text-anchor="middle" fill="#065f46" font-weight="600">Lihat Katalog Alat</text>

    <ellipse cx="490" cy="490" rx="90" ry="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="490" y="495" text-anchor="middle" fill="#065f46" font-weight="600">Ajukan Peminjaman</text>

    <ellipse cx="490" cy="550" rx="90" ry="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="490" y="555" text-anchor="middle" fill="#065f46" font-weight="600">Konfirmasi Pengembalian</text>

    <ellipse cx="490" cy="610" rx="90" ry="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="490" y="615" text-anchor="middle" fill="#065f46" font-weight="600">Lihat Riwayat Pinjaman</text>

    <!-- Actors -->
    <!-- Admin -->
    <circle cx="80" cy="200" r="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <line x1="80" y1="218" x2="80" y2="260" stroke="#ef4444" stroke-width="2"/>
    <line x1="55" y1="235" x2="105" y2="235" stroke="#ef4444" stroke-width="2"/>
    <line x1="80" y1="260" x2="60" y2="285" stroke="#ef4444" stroke-width="2"/>
    <line x1="80" y1="260" x2="100" y2="285" stroke="#ef4444" stroke-width="2"/>
    <text x="80" y="300" text-anchor="middle" font-weight="700" fill="#ef4444">Admin</text>

    <!-- Petugas -->
    <circle cx="880" cy="260" r="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <line x1="880" y1="278" x2="880" y2="320" stroke="#f59e0b" stroke-width="2"/>
    <line x1="855" y1="295" x2="905" y2="295" stroke="#f59e0b" stroke-width="2"/>
    <line x1="880" y1="320" x2="860" y2="345" stroke="#f59e0b" stroke-width="2"/>
    <line x1="880" y1="320" x2="900" y2="345" stroke="#f59e0b" stroke-width="2"/>
    <text x="880" y="360" text-anchor="middle" font-weight="700" fill="#f59e0b">Petugas</text>

    <!-- Peminjam -->
    <circle cx="80" cy="510" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <line x1="80" y1="528" x2="80" y2="570" stroke="#10b981" stroke-width="2"/>
    <line x1="55" y1="545" x2="105" y2="545" stroke="#10b981" stroke-width="2"/>
    <line x1="80" y1="570" x2="60" y2="595" stroke="#10b981" stroke-width="2"/>
    <line x1="80" y1="570" x2="100" y2="595" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="610" text-anchor="middle" font-weight="700" fill="#10b981">Peminjam</text>

    <!-- Lines Admin -->
    <line x1="98" y1="200" x2="280" y2="170" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="98" y1="210" x2="280" y2="230" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="98" y1="220" x2="280" y2="290" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3"/>
    <!-- Admin also login -->
    <line x1="98" y1="195" x2="410" y2="90" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Lines Petugas -->
    <line x1="862" y1="260" x2="710" y2="170" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="862" y1="265" x2="710" y2="230" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="862" y1="270" x2="710" y2="290" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="862" y1="275" x2="710" y2="350" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="862" y1="255" x2="570" y2="90" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Lines Peminjam -->
    <line x1="98" y1="510" x2="400" y2="430" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="98" y1="515" x2="400" y2="490" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="98" y1="520" x2="400" y2="550" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="98" y1="525" x2="400" y2="610" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="98" y1="505" x2="410" y2="90" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Legend -->
    <rect x="210" y="655" width="12" height="12" fill="#fef2f2" stroke="#ef4444"/>
    <text x="228" y="665" fill="#374151" font-size="11">Admin</text>
    <rect x="290" y="655" width="12" height="12" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="308" y="665" fill="#374151" font-size="11">Petugas</text>
    <rect x="370" y="655" width="12" height="12" fill="#ecfdf5" stroke="#10b981"/>
    <text x="388" y="665" fill="#374151" font-size="11">Peminjam</text>
  </svg>
</div>
</body>
</html>
